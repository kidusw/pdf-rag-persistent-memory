[project]
name = "pdf-rag-backend"
version = "0.1.0"
description = "FastAPI backend for PDF RAG chat"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "langchain-core>=1.7.0",
    "langchain-openai>=1.7.3",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "pydantic-settings>=2.16.2",
    "pymongo>=4.19.0",
    "pypdf>=6.21.3",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.20.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "reportlab>=5.1.0",
    "ruff>=0.17.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: needs running Mongo"]
addopts = "-m 'not integration'"
filterwarnings = ["ignore:Payload indexes have no effect in the local Qdrant:UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
